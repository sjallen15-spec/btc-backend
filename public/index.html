// 15-MINUTE WINDOW UTILITIES
// ═══════════════════════════════════════════════════════════════
const MS15 = 15 * 60 * 1000;
function current15mOpenTime(now = Date.now()) { return Math.floor(now / MS15) * MS15; }
function current15mCloseTime(now = Date.now()) { return current15mOpenTime(now) + MS15; }
function msUntilNextBoundary(now = Date.now()) { return current15mCloseTime(now) - now; }
function formatCountdown(ms) {
  if (ms <= 0) return "00:00";
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
}
function fmtTime(ms) { return new Date(ms).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
function fmtDate(ms) { return new Date(ms).toLocaleDateString([],{month:"short",day:"numeric"}); }

async function fetchBTCData() {
  const r = await fetch(`${API_BASE}/btc?interval=15m&limit=100`);
  if (!r.ok) throw new Error(`Backend error: ${r.status}`);
  return r.json();
}

function generateSynthetic(basePrice = 77000, count = 100) {
  const now = Date.now(); const latestOpen = current15mOpenTime(now); const candles = []; let price = basePrice;
  for (let i = 0; i < count; i++) {
    const openTime = latestOpen + (i - (count-1)) * MS15; const closeTime = openTime + MS15 - 1;
    const drift = [0.0008,0.0002,-0.0006,0.0001][Math.floor(i/15)%4]; const vol = 0.005 + Math.random()*0.004;
    const open = price; const close = open*(1+drift+(Math.random()-0.48)*vol);
    const high = Math.max(open,close)+open*Math.random()*0.003; const low = Math.min(open,close)-open*Math.random()*0.003;
    candles.push({ time:openTime, closeTime, open:+open.toFixed(2), high:+high.toFixed(2), low:+low.toFixed(2), close:+close.toFixed(2), volume:+(600+Math.random()*900).toFixed(2) });
    price = close;
  }
  const currentOpen = candles[candles.length-1].open; const livePrice = currentOpen*(1+(Math.random()-0.5)*0.002);
  candles[candles.length-1].close = +livePrice.toFixed(2);
  return { price:+livePrice.toFixed(2), betPrice:currentOpen, priceVsBet:livePrice-currentOpen, priceVsBetPct:((livePrice-currentOpen)/currentOpen)*100, candleOpenTime:candles[candles.length-1].time, candleCloseTime:candles[candles.length-1].closeTime, msUntilClose:msUntilNextBoundary(now), candles, source:"synthetic" };
}

// ═══════════════════════════════════════════════════════════════
// INDICATORS
// ═══════════════════════════════════════════════════════════════
function emaArr(prices, p) {
  const k=2/(p+1), out=[prices[0]];
  for (let i=1;i<prices.length;i++) out.push(prices[i]*k+out[i-1]*(1-k));
  return out;
}
function calcMACD(prices) {
  if (prices.length<26) return {macd:0,signal:0,hist:0,histPrev:0};
  const e12=emaArr(prices,12),e26=emaArr(prices,26),line=e12.map((v,i)=>v-e26[i]),sig=emaArr(line,9),n=line.length-1;
  return {macd:line[n],signal:sig[n],hist:line[n]-sig[n],histPrev:n>0?line[n-1]-sig[n-1]:0};
}
function calcATR(candles) {
  if (candles.length<2) return {current:0,avg:0};
  const trs=candles.slice(1).map((c,i)=>Math.max(c.high-c.low,Math.abs(c.high-candles[i].close),Math.abs(c.low-candles[i].close)));
  const sl=trs.slice(-20);
  return {current:trs[trs.length-1]||0,avg:sl.reduce((a,b)=>a+b,0)/(sl.length||1)};
}
function calcStructure(candles) {
  if (candles.length<10) return {trend:"CHOP",swingHigh:0,swingLow:0,prevSwingHigh:0};
  const s=candles.slice(-10),h=s.map(c=>c.high),l=s.map(c=>c.low),n=h.length-1;
  return { trend:h[n]>h[n-2]&&h[n-2]>h[n-4]&&l[n]>l[n-2]&&l[n-2]>l[n-4]?"UP":h[n]<h[n-2]&&h[n-2]<h[n-4]&&l[n]<l[n-2]&&l[n-2]<l[n-4]?"DOWN":"CHOP", swingHigh:Math.max(...candles.slice(-5).map(c=>c.high)), swingLow:Math.min(...candles.slice(-5).map(c=>c.low)), prevSwingHigh:Math.max(...candles.slice(-10,-5).map(c=>c.high)) };
}
function calcMomentum(candles) {
  if (candles.length<7) return {sameDir:false,expanding:false,dir:"UP"};
  const n=candles.length-1,a=candles[n],b=candles[n-1],d1=a.close>=a.open?"UP":"DOWN",d2=b.close>=b.open?"UP":"DOWN";
  return {sameDir:d1===d2,expanding:Math.abs(a.close-a.open)>candles.slice(-6,-1).reduce((s,c)=>s+Math.abs(c.close-c.open),0)/5,dir:d1};
}
function calcLocation(candles,st) {
  if (candles.length<5) return {penalty:0,reason:null};
  const price=candles[candles.length-1].close,range=st.swingHigh-st.swingLow||1;
  const move=Math.abs(candles.slice(-4)[3].close-candles.slice(-4)[0].open);
  const atrEst=Math.abs(candles[candles.length-1].high-candles[candles.length-1].low);
  if (move>atrEst*2.5) return {penalty:-2,reason:"Overextended — just after large move"};
  if ((st.swingHigh-price)/range<0.1) return {penalty:-1,reason:"Near recent swing high (resistance)"};
  if ((price-st.swingLow)/range<0.1)  return {penalty:-1,reason:"Near recent swing low (support)"};
  return {penalty:0,reason:null};
}

// ═══════════════════════════════════════════════════════════════
// SCORING ENGINE
// ═══════════════════════════════════════════════════════════════
function runEngine(candles, betPrice, livePrice, streak) {
  const closes=candles.map(c=>c.close);
  const e50arr=emaArr(closes,50),e50=e50arr[e50arr.length-1];
  const m=calcMACD(closes),at=calcATR(candles),mom=calcMomentum(candles),st=calcStructure(candles),loc=calcLocation(candles,st);
  const priceVsBet=livePrice-betPrice,priceVsBetPct=(priceVsBet/betPrice)*100,candleDir=livePrice>=betPrice?"UP":"DOWN";
  let score=0; const reasoning=[],warnings=[],bd={};
  let ts=0;
  livePrice>e50?(ts++,reasoning.push("Price above EMA50")):reasoning.push("Price below EMA50");
  m.macd>0?(ts++,reasoning.push("MACD above zero line")):reasoning.push("MACD below zero");
  bd.trend=ts;score+=ts;
  let ms=0;
  mom.sameDir?(ms++,reasoning.push("Last 2 candles same direction")):warnings.push("Conflicting candle directions");
  mom.expanding&&(ms++,reasoning.push("Candle body expanding"));
  bd.momentum=ms;score+=ms;
  let vs=0;
  at.current>at.avg?(vs++,reasoning.push("ATR above 20-period average")):warnings.push("ATR below average — low volatility");
  Math.abs(candles[candles.length-1].close-candles[candles.length-1].open)>candles.slice(-6,-1).reduce((s,c)=>s+Math.abs(c.close-c.open),0)/5&&(vs++,reasoning.push("Candle body above average"));
  bd.volatility=vs;score+=vs;
  let macdS=0;
  ((m.macd>m.signal&&mom.dir==="UP")||(m.macd<m.signal&&mom.dir==="DOWN"))&&(macdS++,reasoning.push("MACD aligned with direction"));
  Math.abs(m.hist)>Math.abs(m.histPrev)&&(macdS++,reasoning.push("MACD histogram expanding"));
  bd.macd=macdS;score+=macdS;
  bd.location=loc.penalty;score+=loc.penalty;
  loc.reason&&warnings.push(loc.reason);
  if(at.current<at.avg*0.5){warnings.push("Volatility too low — suppressed");score=Math.min(score,3);}
  const bv=[livePrice>e50,mom.dir==="UP",m.macd>m.signal].filter(Boolean).length;
  const bvD=[livePrice<e50,mom.dir==="DOWN",m.macd<m.signal].filter(Boolean).length;
  let rawDir=bv>=2&&bvD===0?"UP":bvD>=2&&bv===0?"DOWN":"MIXED";
  let revBlock=false;
  if(rawDir==="UP"&&st.trend==="DOWN"&&livePrice<=st.prevSwingHigh){revBlock=true;warnings.push("Reversal filter: lower high not broken");}
  let signal="NO BET",confidence="LOW";
  if(score>=6&&rawDir!=="MIXED"&&!revBlock){signal=rawDir;confidence="HIGH";}
  else if(score>=4&&rawDir!=="MIXED"&&!revBlock){signal=rawDir;confidence="MEDIUM";}
  let betSize=0;
  if(signal!=="NO BET"&&streak.losses<4){
    betSize=streak.losses===3?2:streak.losses===2?3:streak.wins>=3?6:streak.wins===2?5:4;
  }
  streak.losses>=4&&warnings.push("HARD STOP — 4 consecutive losses");
  Math.abs(priceVsBetPct)>0.1&&reasoning.push(`Price ${priceVsBetPct>0?"+":""}${priceVsBetPct.toFixed(2)}% vs bet price`);
  return {
    timestamp:new Date().toISOString(),signal,confidence,
    score:Math.max(-2,Math.min(8,score)),trend:st.trend,
    reasoning:reasoning.slice(0,5),bet_size_percent:betSize,warnings:warnings.slice(0,4),
    _meta:{livePrice,betPrice,priceVsBet,priceVsBetPct,candleDir,e50,macd:m,atr:at,mom,st,bd,candles:candles.slice(-30)},
  };
}

// ═══════════════════════════════════════════════════════════════
// BACKTEST ENGINE
// ═══════════════════════════════════════════════════════════════
async function runBacktest(onProgress) {
  onProgress("Fetching 2 weeks of candles...");
  let candles = [];
  try {
    const r = await fetch(`${API_BASE}/candles?interval=15m&limit=1344`);
    if (!r.ok) throw new Error("Backend error");
    candles = await r.json();
  } catch {
    onProgress("Backend failed — using synthetic candles");
    const s = generateSynthetic(77000, 200);
    candles = s.candles;
  }
  if (candles.length < 30) throw new Error("Not enough candle data");
  onProgress(`Running engine on ${candles.length} candles...`);
  const results = [];
  const WARMUP = 26;
  for (let i = WARMUP; i < candles.length - 1; i++) {
    const slice = candles.slice(0, i + 1);
    const current = slice[slice.length - 1];
    const next = candles[i + 1];
    const sig = runEngine(slice, current.open, current.close, { wins: 0, losses: 0 });
    const actualDir = next.close > current.close ? "UP" : "DOWN";
    const signalCorrect = sig.signal !== "NO BET" ? sig.signal === actualDir : null;
    results.push({
      time: current.time,
      signal: sig.signal,
      confidence: sig.confidence,
      score: sig.score,
      trend: sig.trend,
      openPrice: current.open,
      closePrice: current.close,
      nextClose: next.close,
      actualDir,
      signalCorrect,
      betPlaced: sig.signal !== "NO BET",
    });
    if (i % 50 === 0) onProgress(`Processed ${i}/${candles.length} candles...`);
  }
  return results;
}

// ═══════════════════════════════════════════════════════════════
// TRADE LOG ENTRY BUILDER

function buildLogEntry(sig, data, outcome = "PENDING") {
  const m = sig._meta;
  return {
    id: data.candleOpenTime, windowOpen: data.candleOpenTime, windowClose: data.candleCloseTime,
    date: fmtDate(data.candleOpenTime), time: fmtTime(data.candleOpenTime),
    signal: sig.signal, confidence: sig.confidence, score: sig.score, trend: sig.trend, bet_size_pct: sig.bet_size_percent,
    betPrice: m.betPrice, livePriceAtSignal: m.livePrice, closePriceActual: null, priceVsBetAtSignal: m.priceVsBetPct,
    indicators: { ema50:+m.e50.toFixed(2), macd:+m.macd.macd.toFixed(2), macdSignal:+m.macd.signal.toFixed(2), macdHist:+m.macd.hist.toFixed(2), atrCurrent:+m.atr.current.toFixed(2), atrAvg:+m.atr.avg.toFixed(2), atrRatio:+(m.atr.current/m.atr.avg).toFixed(3), structure:m.st.trend, swingHigh:+m.st.swingHigh.toFixed(2), swingLow:+m.st.swingLow.toFixed(2), momentumDir:m.mom.dir, momentumSameDir:m.mom.sameDir, momentumExpanding:m.mom.expanding, candleDir:m.candleDir, priceAboveEMA:m.livePrice>m.e50 },
    scoreBreakdown: { ...m.bd }, reasoning: sig.reasoning, warnings: sig.warnings,
    outcome, betPlaced: outcome !== "NO_BET" && outcome !== "PENDING", resolvedAt: outcome !== "PENDING" ? Date.now() : null,
    actualDirection: null, signalCorrect: null,
  };
}

const FG="#e8eeff",FG2="#a8b8d8",FG3="#6677aa",FG4="#3a4a6a";
const BG="#07090f",CARD="#0d1120",BDR="#1e2840";
const GREEN="#00e89a",RED="#ff4d6a",AMBER="#ffb830",BLUE="#5b8dee";

function ScoreBar({label,value,max=2,color}) {
  const pct=max===0?0:Math.max(0,value/max)*100;
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
        <span style={{fontSize:12,color:FG3}}>{label}</span>
        <span style={{fontSize:12,fontWeight:700,color,fontFamily:"monospace"}}>{value>0?`+${value}`:value}/{max}</span>
      </div>
      <div style={{height:4,background:"#0f1525",borderRadius:2}}>
        <div style={{height:"100%",width:`${pct}%`,background:color,borderRadius:2,transition:"width .9s ease"}} />
      </div>
    </div>
  );
}

function WindowProgress({msUntilClose}) {
  const elapsed=MS15-msUntilClose,pct=Math.min(100,(elapsed/MS15)*100);
  const color=msUntilClose<60000?RED:msUntilClose<3*60000?AMBER:GREEN;
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:9,color:FG4,letterSpacing:".15em"}}>WINDOW PROGRESS</span>
        <span style={{fontSize:9,color:FG4}}>{Math.round(elapsed/1000/60*10)/10}m elapsed</span>
      </div>
      <div style={{height:3,background:"#0f1525",borderRadius:2}}>
        <div style={{height:"100%",width:`${pct}%`,background:color,borderRadius:2,transition:"width 1s linear",boxShadow:msUntilClose<60000?`0 0 8px ${RED}99`:"none"}} />
      </div>
    </div>
  );
}

function MiniChart({candles,betPrice}) {
  if (!candles||candles.length<2) return null;
  const sl=candles.slice(-24),allP=[...sl.map(c=>c.high),...sl.map(c=>c.low),betPrice];
  const max=Math.max(...allP),min=Math.min(...allP),range=max-min||1,W=130,H=40;
  const pts=sl.map((c,i)=>`${(i/(sl.length-1))*W},${H-((c.close-min)/range)*H}`).join(" ");
  const betY=H-((betPrice-min)/range)*H;
  return (
    <svg width={W} height={H} style={{overflow:"visible"}}>
      <line x1={0} y1={betY} x2={W} y2={betY} stroke={AMBER} strokeWidth="1" strokeDasharray="3,3" opacity="0.7" />
      <polyline points={pts} fill="none" stroke={sl[sl.length-1].close>=sl[0].open?GREEN:RED} strokeWidth="2" strokeLinejoin="round" />
    </svg>
  );
}

function OutcomeBadge({outcome}) {
  const map={WIN:{color:GREEN,bg:`${GREEN}18`,label:"WIN"},LOSS:{color:RED,bg:`${RED}18`,label:"LOSS"},NO_BET:{color:FG4,bg:"#111",label:"NO BET"},PENDING:{color:AMBER,bg:`${AMBER}18`,label:"PENDING"}};
  const s=map[outcome]||map.PENDING;
  return <span style={{fontSize:10,fontWeight:700,color:s.color,background:s.bg,padding:"2px 8px",borderRadius:4,letterSpacing:".06em"}}>{s.label}</span>;
}

function StreakDots({history}) {
  return (
    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
      {[...Array(20)].map((_,i)=>{
        const h=history[history.length-20+i];
        return <div key={i} style={{width:10,height:10,borderRadius:"50%",background:h==="W"?GREEN:h==="L"?RED:"#1a2235",boxShadow:h==="W"?`0 0 6px ${GREEN}88`:h==="L"?`0 0 6px ${RED}88`:"none"}} />;
      })}
    </div>
  );
}

function LogRow({entry, onSetOutcome}) {
  const sColor=entry.signal==="UP"?GREEN:entry.signal==="DOWN"?RED:FG3;
  const isPending=entry.outcome==="PENDING";
  return (
    <div style={{display:"grid",gridTemplateColumns:"80px 60px 50px 50px 90px 90px 90px 1fr",gap:6,padding:"10px 12px",borderBottom:`1px solid ${BDR}`,alignItems:"center",fontSize:11}}>
      <div><div style={{color:FG,fontWeight:700}}>{entry.time}</div><div style={{color:FG4,fontSize:9}}>{entry.date}</div></div>
      <div style={{fontFamily:"'Bebas Neue'",fontSize:18,color:sColor}}>{entry.signal}</div>
      <div style={{color:entry.score>=6?GREEN:entry.score<=3?RED:AMBER,fontWeight:700}}>{entry.score}/8</div>
      <div style={{color:FG3}}>{entry.confidence.slice(0,3)}</div>
      <div><div style={{color:AMBER,fontSize:10}}>${entry.betPrice?.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0})}</div><div style={{fontSize:9,color:FG4}}>bet price</div></div>
      <div>
        {entry.closePriceActual
          ? <><div style={{color:FG,fontSize:10}}>${entry.closePriceActual?.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0})}</div><div style={{fontSize:9,color:entry.actualDirection==="UP"?GREEN:RED}}>{entry.actualDirection==="UP"?"▲":"▼"} {entry.actualDirection}</div></>
          : <div style={{color:FG4,fontSize:9}}>awaiting close</div>}
      </div>
      <div><OutcomeBadge outcome={entry.outcome} /></div>
      {isPending && (
        <div style={{display:"flex",gap:5}}>
          <button onClick={()=>onSetOutcome(entry.id,"WIN")} style={{background:`${GREEN}18`,border:`1px solid ${GREEN}44`,borderRadius:4,color:GREEN,fontSize:10,padding:"3px 8px",cursor:"pointer"}}>WIN</button>
          <button onClick={()=>onSetOutcome(entry.id,"LOSS")} style={{background:`${RED}18`,border:`1px solid ${RED}44`,borderRadius:4,color:RED,fontSize:10,padding:"3px 8px",cursor:"pointer"}}>LOSS</button>
          <button onClick={()=>onSetOutcome(entry.id,"NO_BET")} style={{background:"#111",border:`1px solid ${BDR}`,borderRadius:4,color:FG4,fontSize:10,padding:"3px 8px",cursor:"pointer"}}>SKIP</button>
        </div>
      )}
      {!isPending && <div style={{fontSize:9,color:FG4}}>{entry.betPlaced?"betted":"no bet"}</div>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// BACKTEST TAB COMPONENT
// ═══════════════════════════════════════════════════════════════
function BacktestTab() {
  const [status, setStatus]   = useState("idle"); // idle | running | done | error
  const [progress, setProgress] = useState("");
  const [results, setResults] = useState(null);
  const [filter, setFilter]   = useState("ALL"); // ALL | HIGH | MEDIUM

  const run = async () => {
    setStatus("running"); setResults(null);
    try {
      const r = await runBacktest(msg => setProgress(msg));
      setResults(r);
      setStatus("done");
    } catch(e) {
      setProgress(e.message);
      setStatus("error");
    }
  };

  const filtered = results ? results.filter(r => {
    if (filter === "HIGH")   return r.confidence === "HIGH";
    if (filter === "MEDIUM") return r.confidence === "MEDIUM" || r.confidence === "HIGH";
    return true;
  }) : [];

  const signaled   = filtered.filter(r => r.betPlaced);
  const correct    = signaled.filter(r => r.signalCorrect === true);
  const noBet      = filtered.filter(r => !r.betPlaced);
  const winRate    = signaled.length > 0 ? Math.round(correct.length / signaled.length * 100) : null;
  const upSignals  = signaled.filter(r => r.signal === "UP");
  const downSignals= signaled.filter(r => r.signal === "DOWN");
  const upWins     = upSignals.filter(r => r.signalCorrect).length;
  const downWins   = downSignals.filter(r => r.signalCorrect).length;

  // P&L sim: $100 per trade
  const BET = 100;
  let pnl = 0;
  signaled.forEach(r => { pnl += r.signalCorrect ? BET * 0.9 : -BET; }); // assume ~90% payout

  // Score breakdown
  const byScore = [4,5,6,7,8].map(s => {
    const trades = signaled.filter(r => r.score === s);
    const wins   = trades.filter(r => r.signalCorrect).length;
    return { score: s, trades: trades.length, wins, rate: trades.length > 0 ? Math.round(wins/trades.length*100) : null };
  });

  return (
    <div className="fi">
      {/* HEADER */}
      <div className="card" style={{marginBottom:12}}>
        <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:8}}>BACKTEST — LAST 2 WEEKS OF REAL DATA</div>
        <div style={{fontSize:12,color:FG2,lineHeight:1.7,marginBottom:14}}>
          Pulls real 15-minute BTC candles from your backend, runs the signal engine on each window, and checks if the prediction was correct against the next candle's close.
        </div>
        <button
          className="btn"
          style={{color:GREEN,borderColor:`${GREEN}55`,padding:"12px 24px",fontSize:13,width:"100%"}}
          onClick={run}
          disabled={status==="running"}
        >
          {status==="running" ? "⏳ RUNNING..." : status==="done" ? "↺ RUN AGAIN" : "▶ RUN BACKTEST"}
        </button>
        {status==="running"&&<div style={{marginTop:10,fontSize:11,color:AMBER,textAlign:"center"}}>{progress}</div>}
        {status==="error"&&<div style={{marginTop:10,fontSize:11,color:RED,textAlign:"center"}}>{progress}</div>}
      </div>

      {results && (
        <>
          {/* FILTER */}
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            {["ALL","MEDIUM","HIGH"].map(f=>(
              <button key={f} className="btn" style={{flex:1,color:filter===f?GREEN:FG3,borderColor:filter===f?`${GREEN}55`:BDR}} onClick={()=>setFilter(f)}>
                {f}
              </button>
            ))}
          </div>

          {/* SUMMARY STATS */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:12}}>
            {[
              {label:"SIGNAL WIN RATE", value:winRate!==null?`${winRate}%`:"—", color:winRate>=60?GREEN:winRate>=50?AMBER:RED, sub:`${correct.length}/${signaled.length} correct`},
              {label:"P&L (SIM $100/trade)", value:`${pnl>=0?"+":""}$${pnl.toFixed(0)}`, color:pnl>=0?GREEN:RED, sub:`${signaled.length} trades placed`},
              {label:"NO BET RATE", value:`${Math.round(noBet.length/filtered.length*100)}%`, color:AMBER, sub:`${noBet.length} windows skipped`},
              {label:"TOTAL WINDOWS", value:filtered.length, color:FG2, sub:`~${Math.round(filtered.length/96)} days of data`},
            ].map(({label,value,color,sub})=>(
              <div key={label} className="card" style={{textAlign:"center"}}>
                <div style={{fontSize:9,color:FG4,marginBottom:6,letterSpacing:".1em"}}>{label}</div>
                <div style={{fontFamily:"'Bebas Neue'",fontSize:28,color,lineHeight:1}}>{value}</div>
                <div style={{fontSize:10,color:FG3,marginTop:4}}>{sub}</div>
              </div>
            ))}
          </div>

          {/* UP vs DOWN */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div className="card" style={{textAlign:"center",borderColor:`${GREEN}33`}}>
              <div style={{fontSize:9,color:FG4,letterSpacing:".1em",marginBottom:6}}>UP SIGNALS</div>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:32,color:GREEN}}>{upSignals.length>0?`${Math.round(upWins/upSignals.length*100)}%`:"—"}</div>
              <div style={{fontSize:10,color:FG3,marginTop:4}}>{upWins}/{upSignals.length} correct</div>
            </div>
            <div className="card" style={{textAlign:"center",borderColor:`${RED}33`}}>
              <div style={{fontSize:9,color:FG4,letterSpacing:".1em",marginBottom:6}}>DOWN SIGNALS</div>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:32,color:RED}}>{downSignals.length>0?`${Math.round(downWins/downSignals.length*100)}%`:"—"}</div>
              <div style={{fontSize:10,color:FG3,marginTop:4}}>{downWins}/{downSignals.length} correct</div>
            </div>
          </div>

          {/* WIN RATE BY SCORE */}
          <div className="card" style={{marginBottom:12}}>
            <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:14}}>WIN RATE BY SCORE</div>
            {byScore.map(({score,trades,wins,rate})=>(
              <div key={score} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:12,color:FG3}}>SCORE {score}/8</span>
                  <span style={{fontSize:12,color:rate>=60?GREEN:rate>=50?AMBER:RED,fontWeight:700}}>
                    {rate!==null?`${rate}%`:"—"} <span style={{color:FG4,fontWeight:400}}>({trades} trades)</span>
                  </span>
                </div>
                <div style={{height:4,background:"#0f1525",borderRadius:2}}>
                  <div style={{height:"100%",width:`${rate||0}%`,background:rate>=60?GREEN:rate>=50?AMBER:RED,borderRadius:2}} />
                </div>
              </div>
            ))}
          </div>

          {/* RECENT SIGNALS TABLE */}
          <div className="card">
            <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:12}}>LAST 20 SIGNALS</div>
            <div style={{overflowX:"auto"}}>
              {signaled.slice(-20).reverse().map((r,i)=>(
                <div key={i} style={{display:"grid",gridTemplateColumns:"80px 60px 50px 50px 1fr",gap:8,padding:"8px 0",borderBottom:`1px solid ${BDR}`,fontSize:11,alignItems:"center"}}>
                  <div style={{color:FG3,fontSize:10}}>{fmtTime(r.time)}</div>
                  <div style={{fontFamily:"'Bebas Neue'",fontSize:16,color:r.signal==="UP"?GREEN:RED}}>{r.signal}</div>
                  <div style={{color:r.score>=6?GREEN:r.score<=3?RED:AMBER}}>{r.score}/8</div>
                  <div style={{fontSize:10,color:FG3}}>{r.confidence.slice(0,3)}</div>
                  <div style={{fontSize:12,color:r.signalCorrect?GREEN:RED,fontWeight:700}}>
                    {r.signalCorrect ? "✓ CORRECT" : "✗ WRONG"}
                    <span style={{color:FG4,fontSize:10,fontWeight:400,marginLeft:8}}>{r.actualDir}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// MAIN APP

function BTCDecisionEngine() {
  const [result,setResult]         = useState(null);
  const [loading,setLoading]       = useState(false);
  const [loadMsg,setLoadMsg]       = useState("");
  const [error,setError]           = useState(null);
  const [streak,setStreak]         = useState({wins:0,losses:0});
  const [tradeLog,setTradeLog]     = useState([]);
  const [bankroll,setBankroll]     = useState(1000);
  const [lastRefresh,setLastRefresh] = useState(null);
  const [source,setSource]         = useState("");
  const [msLeft,setMsLeft]         = useState(msUntilNextBoundary());
  const [tab,setTab]               = useState("signal");
  const [storageReady,setStorageReady] = useState(false);
  const [tgStatus,setTgStatus]     = useState("");
  const lastBoundaryRef            = useRef(current15mOpenTime());
  const pendingWindowRef           = useRef(null);
  const timerRef                   = useRef(null);

  useEffect(() => {
    (async () => {
      const [log, sk] = await Promise.all([loadLog(), loadStreak()]);
      setTradeLog(log); setStreak(sk); setStorageReady(true);
    })();
  }, []);

  const resolveClosedWindow = useCallback(async (windowCloseTime, windowOpenTime) => {
    try {
      let closePrice = null;
      try {
        const r = await fetch(`${API_BASE}/candles?interval=15m&limit=5`);
        if (r.ok) { const candles = await r.json(); const match = candles.find(c => Math.abs(c.time - windowOpenTime) < 60000); if (match) closePrice = match.close; }
      } catch {}
      if (closePrice) {
        setTradeLog(prev => {
          const updated = prev.map(entry => {
            if (entry.id !== windowOpenTime) return entry;
            const actualDirection = closePrice > entry.betPrice ? "UP" : "DOWN";
            const signalCorrect = entry.signal !== "NO BET" ? entry.signal === actualDirection : null;
            const outcome = entry.outcome === "PENDING" ? "NO_BET" : entry.outcome;
            return { ...entry, closePriceActual:closePrice, actualDirection, signalCorrect, outcome, resolvedAt: entry.resolvedAt || Date.now() };
          });
          saveLog(updated); return updated;
        });
      }
    } catch (e) { console.error("resolve error", e); }
  }, []);

  const refresh = useCallback(async (isNewWindow = false) => {
    setLoading(true); setError(null); setLoadMsg("Fetching live data...");
    try {
      let data;
      try { data = await fetchBTCData(); }
      catch(e) { setLoadMsg("Backend unreachable — using synthetic data"); data = generateSynthetic(77000,100); }
      setLoadMsg("Running scoring engine...");
      setSource(data.source);
      const sk = streak;
      const out = runEngine(data.candles, data.betPrice, data.price, sk);
      out._meta.candleOpenTime  = data.candleOpenTime;
      out._meta.candleCloseTime = data.candleCloseTime;
      out._meta.msUntilClose    = data.msUntilClose;
      setResult(out);
      setLastRefresh(new Date());
      setMsLeft(data.msUntilClose || msUntilNextBoundary());

      // Telegram notification on new window if score qualifies
      if (isNewWindow && out.signal !== "NO BET" && out.score >= TG_MIN_SCORE) {
        sendTelegramAlert(out, data.price, data.betPrice).then(() => {
          if (TG_BOT_TOKEN && TG_CHAT_ID) { setTgStatus("✓ Alert sent"); setTimeout(()=>setTgStatus(""),3000); }
        });
      }

      if (isNewWindow) {
        const entry = buildLogEntry(out, data, "PENDING");
        setTradeLog(prev => {
          if (prev.find(e => e.id === entry.id)) return prev;
          const updated = [entry, ...prev].slice(0, 200);
          saveLog(updated); return updated;
        });
      }
    } catch(e) { setError(e.message); }
    finally { setLoading(false); setLoadMsg(""); }
  }, [streak]);

  useEffect(() => {
    const tick = async () => {
      const now = Date.now(); const ms = msUntilNextBoundary(now); setMsLeft(ms);
      const boundary = current15mOpenTime(now);
      if (boundary > lastBoundaryRef.current) {
        const prevBoundary = lastBoundaryRef.current; lastBoundaryRef.current = boundary;
        resolveClosedWindow(prevBoundary + MS15, prevBoundary); refresh(true);
      }
    };
    timerRef.current = setInterval(tick, 1000);
    return () => clearInterval(timerRef.current);
  }, [refresh, resolveClosedWindow]);

  useEffect(() => { if (storageReady) refresh(false); }, [storageReady]);

  const setOutcome = useCallback(async (id, outcome) => {
    setTradeLog(prev => {
      const updated = prev.map(e => {
        if (e.id !== id) return e;
        const betPlaced = outcome !== "NO_BET";
        const newStreak = betPlaced ? outcome === "WIN" ? { wins: streak.wins+1, losses:0 } : { wins:0, losses: streak.losses+1 } : streak;
        if (betPlaced) { setStreak(newStreak); saveStreak(newStreak); }
        return { ...e, outcome, betPlaced, resolvedAt: Date.now() };
      });
      saveLog(updated); return updated;
    });
  }, [streak]);

  const exportCSV = () => {
    const headers = ["date","time","signal","confidence","score","trend","betPrice","livePriceAtSignal","closePriceActual","actualDirection","outcome","betPlaced","signalCorrect","bet_size_pct","ema50","macd","macdSignal","macdHist","atrCurrent","atrAvg","atrRatio","structure","momentumDir","momentumSameDir","momentumExpanding","priceAboveEMA","score_trend","score_momentum","score_volatility","score_macd","score_location","reasoning","warnings"];
    const rows = tradeLog.map(e => [e.date,e.time,e.signal,e.confidence,e.score,e.trend,e.betPrice,e.livePriceAtSignal,e.closePriceActual??"",e.actualDirection??"",e.outcome,e.betPlaced,e.signalCorrect??"",e.bet_size_pct,e.indicators.ema50,e.indicators.macd,e.indicators.macdSignal,e.indicators.macdHist,e.indicators.atrCurrent,e.indicators.atrAvg,e.indicators.atrRatio,e.indicators.structure,e.indicators.momentumDir,e.indicators.momentumSameDir,e.indicators.momentumExpanding,e.indicators.priceAboveEMA,e.scoreBreakdown.trend,e.scoreBreakdown.momentum,e.scoreBreakdown.volatility,e.scoreBreakdown.macd,e.scoreBreakdown.location,`"${e.reasoning?.join("; ")}"`,`"${e.warnings?.join("; ")}"`].join(","));
    const csv = [headers.join(","), ...rows].join("\n");
    const blob = new Blob([csv], {type:"text/csv"}); const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href=url; a.download=`btc_trades_${Date.now()}.csv`; a.click(); URL.revokeObjectURL(url);
  };

  const bettedEntries  = tradeLog.filter(e => e.betPlaced && e.outcome !== "PENDING");
  const wins           = bettedEntries.filter(e => e.outcome==="WIN").length;
  const accuracy       = bettedEntries.length > 0 ? Math.round(wins/bettedEntries.length*100) : null;
  const signalAccuracy = tradeLog.filter(e=>e.signalCorrect!==null).length > 0 ? Math.round(tradeLog.filter(e=>e.signalCorrect===true).length / tradeLog.filter(e=>e.signalCorrect!==null).length * 100) : null;

  const sig=result,hardStop=streak.losses>=4;
  const sColor=!sig?"#445":sig.signal==="UP"?GREEN:sig.signal==="DOWN"?RED:"#445";
  const cColor=!sig?"#445":sig.confidence==="HIGH"?GREEN:sig.confidence==="MEDIUM"?AMBER:FG3;
  const meta=sig?._meta;
  const urgent=msLeft<60000;
  const countdownColor=urgent?RED:msLeft<3*60000?AMBER:GREEN;
  const srcColor=source==="cryptocompare"||source==="binance"?GREEN:source==="synthetic"?RED:AMBER;

  return (
    <div style={{minHeight:"100vh",background:BG,color:FG,fontFamily:"'DM Mono','Courier New',monospace",padding:"18px 14px 100px"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        .card{background:${CARD};border:1px solid ${BDR};border-radius:10px;padding:15px}
        .card-up{border-color:${GREEN}44!important;box-shadow:0 0 20px ${GREEN}0d}
        .card-dn{border-color:${RED}44!important;box-shadow:0 0 20px ${RED}0d}
        .btn{background:${CARD};border:1px solid ${BDR};border-radius:6px;color:${FG3};font-family:inherit;font-size:11px;padding:7px 13px;cursor:pointer;letter-spacing:.08em;transition:all .2s}
        .btn:hover{border-color:${FG4};color:${FG}}
        .tab{background:transparent;border:none;border-bottom:2px solid transparent;color:${FG3};font-family:inherit;font-size:11px;padding:8px 14px;cursor:pointer;letter-spacing:.1em;transition:all .2s}
        .tab.active{color:${FG};border-bottom-color:${GREEN}}
        .tab:hover{color:${FG2}}
        .fi{animation:fi .4s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        .spin{animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
        .pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.2}}
        .urgent{animation:urg .6s ease-in-out infinite}@keyframes urg{0%,100%{opacity:1}50%{opacity:.3}}
        input[type=number]{background:${CARD};border:1px solid ${BDR};border-radius:5px;color:${FG};font-family:inherit;font-size:13px;padding:7px 9px;width:100%;outline:none}
        input[type=number]:focus{border-color:${FG4}}
        .refresh-fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;background:#1a2540;border:1px solid ${GREEN}55;border-radius:50px;color:${GREEN};font-family:inherit;font-size:13px;padding:14px 32px;cursor:pointer;letter-spacing:.1em;box-shadow:0 4px 24px #000a;transition:all .2s}
        .refresh-fab:hover{background:#1e2e50;box-shadow:0 4px 32px ${GREEN}33}
        .refresh-fab:active{transform:translateX(-50%) scale(0.97)}
      `}</style>

      <div style={{maxWidth:480,margin:"0 auto"}}>
        {/* HEADER */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:28,letterSpacing:".08em",lineHeight:1}}>BTC DECISION ENGINE</div>
            <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginTop:4}}>15-MINUTE WINDOW · BINANCE LIVE · SELF-LOGGING</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,justifyContent:"flex-end"}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:source?srcColor:"#445",boxShadow:source?`0 0 6px ${srcColor}88`:""}} className={loading?"pulse":""} />
            </div>
            <div style={{fontSize:9,color:FG4,marginTop:4}}>{lastRefresh?lastRefresh.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—"} · <span style={{color:srcColor}}>{source||"—"}</span></div>
            {tgStatus&&<div style={{fontSize:9,color:GREEN,marginTop:2}}>{tgStatus}</div>}
          </div>
        </div>

        {/* TABS */}
        <div style={{display:"flex",borderBottom:`1px solid ${BDR}`,marginBottom:16,gap:0}}>
          {[["signal","SIGNAL"],["log","TRADE LOG"],["backtest","BACKTEST"],["export","EXPORT DATA"]].map(([id,label])=>(
            <button key={id} className={`tab${tab===id?" active":""}`} onClick={()=>setTab(id)}>{label}</button>
          ))}
        </div>

        {/* COUNTDOWN HEADER */}
        {tab==="signal"&&(
          <div className="card fi" style={{marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:4}}>CURRENT 15M WINDOW</div>
              <div style={{fontSize:13,color:FG2}}>Opens <span style={{color:FG,fontWeight:700}}>{fmtTime(current15mOpenTime())}</span> → <span style={{color:FG,fontWeight:700}}>{fmtTime(current15mCloseTime())}</span></div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:2}}>TIME LEFT</div>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:36,color:countdownColor,lineHeight:1}} className={urgent?"urgent":""}>{formatCountdown(msLeft)}</div>
            </div>
          </div>
        )}

        {/* SIGNAL TAB */}
        {tab==="signal"&&(
          <div className="fi">
            {loading&&<div className="card fi" style={{marginBottom:12,textAlign:"center",padding:26}}>
              <div style={{fontSize:12,color:FG2,letterSpacing:".12em"}}>{loadMsg}</div>
              <div style={{display:"flex",justifyContent:"center",gap:5,marginTop:12}}>
                {[0,1,2,3,4].map(i=><div key={i} style={{width:5,height:5,borderRadius:"50%",background:GREEN,animation:`pl 1.1s ease-in-out ${i*.13}s infinite`}}/>)}
              </div>
            </div>}
            {error&&!loading&&<div className="card fi" style={{borderColor:`${RED}44`,marginBottom:12,fontSize:12,color:RED}}>{error}</div>}
            {hardStop&&<div className="card fi" style={{borderColor:`${RED}88`,marginBottom:12,background:"#180a0e",textAlign:"center",padding:18}}>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:26,color:RED,letterSpacing:".1em"}}>⛔ HARD STOP ACTIVE</div>
              <div style={{fontSize:11,color:FG3,marginTop:4}}>4 consecutive losses — betting suspended</div>
              <button className="btn" style={{marginTop:10}} onClick={()=>{setStreak({wins:0,losses:0});saveStreak({wins:0,losses:0});}}>RESET STREAK</button>
            </div>}

            {sig&&!loading&&(
              <>
                <div style={{display:"grid",gridTemplateColumns:"1.3fr .8fr 1fr 1fr",gap:10,marginBottom:12}}>
                  <div className={`card ${sig.signal==="UP"?"card-up":sig.signal==="DOWN"?"card-dn":""}`} style={{textAlign:"center",padding:"20px 10px"}}>
                    <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:8}}>PREDICT</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:46,color:sColor,lineHeight:1}}>{sig.signal}</div>
                    <div style={{fontSize:10,color:FG3,marginTop:8}}>vs <span style={{color:AMBER,fontWeight:700}}>BET PRICE</span></div>
                    <div style={{fontSize:9,color:FG4,marginTop:4}}>TREND <span style={{color:FG}}>{sig.trend}</span></div>
                  </div>
                  <div className="card" style={{textAlign:"center"}}>
                    <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:8}}>SCORE</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:44,color:sig.score>=6?GREEN:sig.score<=3?RED:AMBER,lineHeight:1}}>{sig.score}</div>
                    <div style={{fontSize:10,color:FG3,marginTop:4}}>/ 8 MAX</div>
                  </div>
                  <div className="card" style={{textAlign:"center"}}>
                    <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:8}}>CONFIDENCE</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:24,color:cColor,lineHeight:1.1}}>{sig.confidence}</div>
                    <div style={{fontSize:9,color:FG4,marginTop:10}}>BET SIZE</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:32,color:hardStop?RED:sig.bet_size_percent>0?AMBER:FG4,marginTop:2}}>{hardStop?"STOP":`${sig.bet_size_percent}%`}</div>
                  </div>
                  <div className="card" style={{textAlign:"center"}}>
                    <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:8}}>BANKROLL</div>
                    <input type="number" value={bankroll} onChange={e=>setBankroll(Math.max(0,+e.target.value))} style={{textAlign:"center",marginBottom:10}}/>
                    <div style={{fontSize:9,color:FG4}}>BET AMOUNT</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:26,color:FG,marginTop:3}}>${((bankroll*(hardStop?0:sig.bet_size_percent))/100).toFixed(2)}</div>
                  </div>
                </div>

                <div className="card" style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <div>
                      <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:2}}>CURRENT 15M WINDOW</div>
                      <div style={{fontSize:13,color:FG2}}>
                        <span style={{color:AMBER,fontWeight:700}}>${meta?.betPrice.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
                        <span style={{color:FG4,fontSize:10}}> BET PRICE</span>
                      </div>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:9,color:FG4,marginBottom:2}}>LIVE PRICE</div>
                      <div style={{fontFamily:"'Bebas Neue'",fontSize:22,color:FG}}>${meta?.livePrice.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
                      <div style={{fontSize:10,color:FG4}}>right now</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:9,color:FG4,marginBottom:2}}>VS BET</div>
                      <div style={{fontFamily:"'Bebas Neue'",fontSize:22,color:meta?.priceVsBet>=0?GREEN:RED}}>
                        {meta?.priceVsBet>=0?"+":""}{meta?.priceVsBet.toFixed(0)}
                      </div>
                      <div style={{fontSize:10,color:FG4}}>{meta?.priceVsBetPct>=0?"+":""}{meta?.priceVsBetPct.toFixed(3)}%</div>
                    </div>
                  </div>
                  <WindowProgress msUntilClose={msLeft}/>
                </div>

                <div className="card" style={{marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:4}}>EMA50</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:28,color:meta?.livePrice>meta?.e50?GREEN:RED,lineHeight:1}}>${meta?.e50.toFixed(0)}</div>
                    <div style={{fontSize:11,color:FG3,marginTop:4}}>{meta?.livePrice>meta?.e50?"▲ Above EMA50":"▼ Below EMA50"}</div>
                  </div>
                  <MiniChart candles={sig._meta.candles} betPrice={meta?.betPrice}/>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:9,color:FG4,letterSpacing:".12em",marginBottom:4}}>CANDLE DIR</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:28,color:meta?.candleDir==="UP"?GREEN:RED}}>{meta?.candleDir==="UP"?"▲ UP":"▼ DOWN"}</div>
                    <div style={{fontSize:9,color:FG4,marginTop:4}}>vs bet price</div>
                  </div>
                </div>

                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                  <div className="card">
                    <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:14}}>SCORE BREAKDOWN</div>
                    <ScoreBar label="TREND" value={sig._meta.bd.trend} color={BLUE}/>
                    <ScoreBar label="MOMENTUM" value={sig._meta.bd.momentum} color={GREEN}/>
                    <ScoreBar label="VOLATILITY" value={sig._meta.bd.volatility} color="#a78bfa"/>
                    <ScoreBar label="MACD STRENGTH" value={sig._meta.bd.macd} color={AMBER}/>
                    <ScoreBar label="LOCATION PENALTY" value={sig._meta.bd.location} max={0} color={RED}/>
                    <div style={{borderTop:`1px solid ${BDR}`,marginTop:12,paddingTop:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:11,color:FG2}}>TOTAL SCORE</span>
                      <span style={{fontFamily:"'Bebas Neue'",fontSize:20,color:sig.score>=6?GREEN:sig.score<=3?RED:AMBER}}>{sig.score} / 8</span>
                    </div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:10}}>
                    <div className="card" style={{flex:1}}>
                      <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:10}}>REASONING</div>
                      {sig.reasoning.map((r,i)=>(
                        <div key={i} style={{display:"flex",gap:8,marginBottom:8}}>
                          <span style={{color:GREEN,fontSize:9,marginTop:2,flexShrink:0}}>▸</span>
                          <span style={{fontSize:11,color:FG2,lineHeight:1.55}}>{r}</span>
                        </div>
                      ))}
                    </div>
                    {sig.warnings.length>0&&(
                      <div className="card" style={{borderColor:`${AMBER}28`}}>
                        <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:10}}>WARNINGS</div>
                        {sig.warnings.map((w,i)=>(
                          <div key={i} style={{display:"flex",gap:8,marginBottom:8}}>
                            <span style={{color:AMBER,fontSize:9,marginTop:2,flexShrink:0}}>⚠</span>
                            <span style={{fontSize:11,color:FG2,lineHeight:1.55}}>{w}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:12}}>
                  {[
                    {label:"MACD",value:sig._meta.macd.macd.toFixed(0),sub:`SIG ${sig._meta.macd.signal.toFixed(0)}`,color:sig._meta.macd.macd>0?GREEN:RED},
                    {label:"HIST",value:sig._meta.macd.hist.toFixed(0),sub:Math.abs(sig._meta.macd.hist)>Math.abs(sig._meta.macd.histPrev)?"EXPANDING":"SHRINKING",color:sig._meta.macd.hist>0?GREEN:RED},
                    {label:"ATR",value:`$${sig._meta.atr.current.toFixed(0)}`,sub:`AVG $${sig._meta.atr.avg.toFixed(0)}`,color:sig._meta.atr.current>sig._meta.atr.avg?GREEN:AMBER},
                    {label:"TREND",value:sig._meta.st.trend,sub:"STRUCTURE",color:sig._meta.st.trend==="UP"?GREEN:sig._meta.st.trend==="DOWN"?RED:FG3},
                  ].map(({label,value,sub,color})=>(
                    <div key={label} className="card" style={{textAlign:"center"}}>
                      <div style={{fontSize:9,color:FG4,letterSpacing:".12em",marginBottom:6}}>{label}</div>
                      <div style={{fontFamily:"'Bebas Neue'",fontSize:22,color,lineHeight:1}}>{value}</div>
                      <div style={{fontSize:10,color:FG3,marginTop:5}}>{sub}</div>
                    </div>
                  ))}
                </div>

                <div className="card" style={{marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                    <div style={{fontSize:9,color:FG4,letterSpacing:".15em"}}>SESSION PERFORMANCE</div>
                    <div style={{display:"flex",gap:16}}>
                      {[
                        {label:"ACCURACY",value:accuracy!==null?`${accuracy}%`:"—",color:accuracy>=60?GREEN:accuracy<40?RED:AMBER},
                        {label:"SIG ACC",value:signalAccuracy!==null?`${signalAccuracy}%`:"—",color:signalAccuracy>=60?GREEN:signalAccuracy<40?RED:AMBER},
                        {label:"WIN STK",value:streak.wins,color:GREEN},
                        {label:"LOSS STK",value:streak.losses,color:streak.losses>=3?RED:FG},
                        {label:"TRADES",value:bettedEntries.length,color:FG2},
                      ].map(({label,value,color})=>(
                        <div key={label} style={{textAlign:"center"}}>
                          <div style={{fontSize:8,color:FG4}}>{label}</div>
                          <div style={{fontFamily:"'Bebas Neue'",fontSize:18,color,marginTop:1}}>{value}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <StreakDots history={[...bettedEntries.slice(-20).map(e=>e.outcome==="WIN"?"W":"L")]}/>
                </div>
              </>
            )}
          </div>
        )}

        {/* TRADE LOG TAB */}
        {tab==="log"&&(
          <div className="fi">
            <div className="card" style={{marginBottom:12,padding:"10px 0"}}>
              <div style={{display:"grid",gridTemplateColumns:"80px 60px 50px 50px 90px 90px 90px 1fr",gap:6,padding:"6px 12px 10px",borderBottom:`1px solid ${BDR}`,fontSize:9,color:FG4,letterSpacing:".1em"}}>
                <span>TIME</span><span>SIGNAL</span><span>SCORE</span><span>CONF</span><span>BET PRICE</span><span>CLOSE</span><span>OUTCOME</span><span>ACTION</span>
              </div>
              {tradeLog.length===0&&<div style={{textAlign:"center",padding:40,color:FG4,fontSize:12}}>No trades logged yet.</div>}
              <div style={{maxHeight:500,overflowY:"auto"}}>
                {tradeLog.map(entry=>(<LogRow key={entry.id} entry={entry} onSetOutcome={setOutcome}/>))}
              </div>
            </div>
            {tradeLog.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
                {[
                  {label:"TOTAL SIGNALS",value:tradeLog.length,color:FG2},
                  {label:"BETS PLACED",value:bettedEntries.length,color:BLUE},
                  {label:"WIN RATE",value:accuracy!==null?`${accuracy}%`:"—",color:accuracy>=60?GREEN:accuracy<40?RED:AMBER},
                  {label:"SIGNAL ACCURACY",value:signalAccuracy!==null?`${signalAccuracy}%`:"—",color:signalAccuracy>=60?GREEN:signalAccuracy<40?RED:AMBER},
                ].map(({label,value,color})=>(
                  <div key={label} className="card" style={{textAlign:"center"}}>
                    <div style={{fontSize:9,color:FG4,marginBottom:6}}>{label}</div>
                    <div style={{fontFamily:"'Bebas Neue'",fontSize:26,color}}>{value}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* BACKTEST TAB */}
        {tab==="backtest"&&<BacktestTab/>}

        {/* EXPORT TAB */}
        {tab==="export"&&(
          <div className="fi">
            <div className="card" style={{marginBottom:12}}>
              <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:12}}>EXPORT TRADE DATA</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <button className="btn" style={{color:GREEN,borderColor:`${GREEN}55`,padding:"10px 20px",fontSize:12}} onClick={exportCSV}>↓ EXPORT CSV ({tradeLog.length} rows)</button>
                <button className="btn" style={{color:BLUE,borderColor:`${BLUE}55`,padding:"10px 20px",fontSize:12}} onClick={()=>{const json=JSON.stringify(tradeLog,null,2);const blob=new Blob([json],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`btc_trades_${Date.now()}.json`;a.click();URL.revokeObjectURL(url);}}>↓ EXPORT JSON ({tradeLog.length} rows)</button>
                <button className="btn" style={{color:RED,borderColor:`${RED}44`,padding:"10px 20px",fontSize:12}} onClick={async()=>{if(confirm("Delete all logged trades?")) {await saveLog([]);setTradeLog([]);}}}>✕ CLEAR LOG</button>
              </div>
            </div>

            {/* TELEGRAM SETUP */}
            <div className="card" style={{borderColor:`${BLUE}33`}}>
              <div style={{fontSize:9,color:FG4,letterSpacing:".15em",marginBottom:12}}>TELEGRAM SETUP</div>
              <div style={{fontSize:12,color:FG2,lineHeight:1.9}}>
                <div style={{color:GREEN,marginBottom:8}}>Step 1 — Create your bot:</div>
                Open Telegram → search <span style={{color:FG}}>@BotFather</span> → send <span style={{color:AMBER}}>/newbot</span> → follow prompts → copy the <span style={{color:FG}}>API token</span>
                <div style={{color:GREEN,marginBottom:8,marginTop:12}}>Step 2 — Get your Chat ID:</div>
                Search <span style={{color:FG}}>@userinfobot</span> in Telegram → send any message → copy your <span style={{color:FG}}>Id</span> number
                <div style={{color:GREEN,marginBottom:8,marginTop:12}}>Step 3 — Update the app:</div>
                Open <span style={{color:FG}}>public/index.html</span> on your computer and find these two lines near the top:
                <pre style={{background:"#0a0f1c",padding:"10px",borderRadius:6,marginTop:8,fontSize:11,color:AMBER,overflowX:"auto"}}>
{`const TG_BOT_TOKEN = ""; // paste your token here
const TG_CHAT_ID   = ""; // paste your chat ID here`}
                </pre>
                <div style={{color:GREEN,marginBottom:8,marginTop:12}}>Step 4 — Deploy:</div>
                Save the file, then run: <span style={{color:AMBER}}>git add . && git commit -m "add telegram" && git push</span>
                <div style={{color:FG3,fontSize:11,marginTop:12}}>
                  Notifications fire automatically at each 15-minute boundary when score ≥ {TG_MIN_SCORE} and signal is UP or DOWN.
                </div>
              </div>
            </div>
          </div>
        )}

        <div style={{textAlign:"center",fontSize:9,color:FG4,marginTop:18,letterSpacing:".12em"}}>
          NOT FINANCIAL ADVICE · EDUCATIONAL TOOL ONLY
        </div>
      </div>

      {/* FLOATING REFRESH BUTTON */}
      <button className="refresh-fab" onClick={()=>refresh(false)} disabled={loading}>
        {loading ? "⏳ LOADING..." : "↺  REFRESH"}
      </button>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(BTCDecisionEngine));
  </script>
</body>
</html>
